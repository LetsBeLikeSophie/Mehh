<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>묶음 안 추천 정리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#37352F;text-decoration:none}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #37352F; display: flex; flex-direction: column">
  <div style="flex: 1; overflow: hidden; padding: 48px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <a href="Main.dc.html" aria-label="묶음 목록으로" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#37352F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px">10월 3일 · 롯데월드</div>
      <div style="font-size: 14px; color: #787774">214장 · 오후 1:12 – 8:40</div>
    </div>
    <div style="background: #F7F7F5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 15px; font-weight: 600"><span style="background: #111111; color: #FFFFFF; border-radius: 4px; padding: 0 6px">138장</span> 정리할게요</div>
      <div style="font-size: 13px; color: #787774; line-height: 1.5">흔들린 사진 21장, 비슷한 연속 컷 117장. 음식 사진은 보통 1장만 남기셔서 그렇게 골랐어요.</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 13px; color: #787774">눌러서 살릴 사진만 고르세요</div>
      <button style="font-family: inherit; font-size: 13px; color: #37352F; background: none; border: 0; height: 44px; padding: 0">이 날은 다 남기기</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="16">
        <div style="position: relative; aspect-ratio: 1; border-radius: 6px; background: #F1F1EF; display: flex; align-items: center; justify-content: center; opacity: {{t.op}}">
          <svg aria-hidden="true" width="36%" viewBox="0 0 24 24" fill="none" stroke="#ACABA9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="2"></circle><path d="M3 19 L9 12 L13 16 L16 13 L21 19"></path></svg>
          <sc-if value="{{t.best}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 500; color: #FFFFFF; background: #111111; border-radius: 4px; padding: 1px 5px">베스트</div>
          </sc-if>
          <sc-if value="{{t.out}}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="position: absolute; right: 4px; top: 4px; width: 16px; height: 16px; border-radius: 999px; background: #111111; display: flex; align-items: center; justify-content: center">
              <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; gap: 8px; padding: 16px 20px 32px">
    <a href="Swipe.dc.html" style="flex: 1; height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #E9E9E7; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">하나씩 보기</a>
    <button style="flex: 1.4; height: 48px; border-radius: 8px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500">추천대로 정리</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const best = [0, 5, 10, 14];
    const tiles = Array.from({ length: 16 }, (_, i) => {
      const isBest = best.includes(i);
      const out = !isBest && i % 3 !== 2;
      return { best: isBest, out, op: out ? 0.45 : 1 };
    });
    return { tiles };
  }
}
</script>
</body>
</html>
