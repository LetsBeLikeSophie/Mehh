<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>하나씩 넘기기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#37352F;text-decoration:none}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #37352F; display: flex; flex-direction: column; padding: 48px 20px 32px; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Group.dc.html" aria-label="묶음으로 돌아가기" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#37352F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size: 14px; color: #787774">연속 컷 3 / 12</div>
    <button aria-label="되돌리기" style="width: 44px; height: 44px; margin-right: -12px; background: none; border: 0; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#37352F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>
    </button>
  </div>
  <div style="font-size: 12px; color: #787774; text-align: center">위로 올리면 보류</div>
  <div style="flex: 1; position: relative; border-radius: 16px; background: #F1F1EF; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="#ACABA9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="2"></circle><path d="M3 19 L9 12 L13 16 L16 13 L21 19"></path></svg>
    <div style="position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px">
      <div style="font-size: 12px; font-weight: 500; color: #FFFFFF; background: #111111; border-radius: 6px; padding: 3px 8px">베스트 추천</div>
      <div style="font-size: 12px; color: #37352F; background: #FFFFFF; border-radius: 6px; padding: 3px 8px">초점 선명 · 눈 뜸</div>
    </div>
  </div>
  <div style="font-size: 12px; color: #787774; text-align: center">아래로 내리면 킵 · 좌우로 넘기기</div>
  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{strip}}" as="s" hint-placeholder-count="8">
      <div aria-hidden="true" style="aspect-ratio: 1; box-sizing: border-box; border-radius: 4px; background: #F1F1EF; border: {{s.border}}; opacity: {{s.op}}"></div>
    </sc-for>
  </div>
  <div style="display: flex; gap: 8px">
    <button style="flex: 1; height: 48px; border-radius: 8px; border: 1px solid #E9E9E7; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #37352F">보류</button>
    <button style="flex: 1; height: 48px; border-radius: 8px; border: 0; background: #111111; font-family: inherit; font-size: 15px; font-weight: 500; color: #FFFFFF">킵</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const strip = Array.from({ length: 8 }, (_, i) => ({
      border: i === 2 ? '2px solid #111111' : '0',
      op: i < 2 ? 0.45 : 1
    }));
    return { strip };
  }
}
</script>
</body>
</html>
