name: mehh
description: "Mehh: 사진 정리, 중복 사진 삭제"
publish_to: 'none'

version: 1.10.2+35

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geocoding: ^5.0.0
  image: ^4.12.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  intl: ^0.20.3
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  pointycastle: ^4.0.0
  sqflite: ^2.4.4+2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 다국어: lib/l10n/app_ko.arb·app_en.arb → L10n (l10n.yaml)
  generate: true

  assets:
    - assets/mehh-goat.png
    - assets/mehh-goat-mehh.png

  # Mehh Sans KR = IBM Plex Sans KR을 줄인 것 (OFL, fonts/OFL.txt, tool/subset_fonts.py)
  fonts:
    - family: Mehh Sans KR
      fonts:
        - asset: fonts/MehhSansKR-Regular.ttf
        - asset: fonts/MehhSansKR-Medium.ttf
          weight: 500
        - asset: fonts/MehhSansKR-SemiBold.ttf
          weight: 600
        - asset: fonts/MehhSansKR-Bold.ttf
          weight: 700
