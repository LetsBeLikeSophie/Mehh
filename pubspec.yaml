name: mehh
description: "Mehh: 사진 정리, 중복 사진 삭제"
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geocoding: ^5.0.0
  image: ^4.12.0
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mehh-goat.png
    - assets/mehh-goat-mehh.png

  # IBM Plex Sans KR (OFL, fonts/OFL.txt)
  fonts:
    - family: IBM Plex Sans KR
      fonts:
        - asset: fonts/IBMPlexSansKR-Regular.ttf
        - asset: fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansKR-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
